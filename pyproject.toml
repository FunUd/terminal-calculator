[project]
name = "terminal-calculator"
version = "0.1.0"
description = "Windows 11 数式入力型TUI電卓"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
]

[project.scripts]
calc = "calc.app:main"
tc = "calc.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
]
